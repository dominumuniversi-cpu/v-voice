name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) Синтаксис Python-модулей — быстро, без установки зависимостей.
      - name: python syntax
        run: node scripts/syntax-check.mjs

      # 2) Контракт нативных мостов: записи на Android/iOS не разошлись.
      - name: native contract
        run: node tests/native/native-drift-check.mjs

      # 3) Сквозные кейсы конвейера и контракта.
      - name: node tests
        run: node --test "tests/native/*.test.mjs" "tests/api/*.mjs"

      # 4) Мобильное приложение: анализатор и тесты контроллера (реальные, без телефона).
      # Java 17 явно: на раннере может стоять Java 25, и Gradle 8.x падает на
      # "Unsupported class file major version 69" — ошибка выглядит как проблема проекта.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: flutter analyze
        working-directory: apps/mobile
        run: flutter pub get && flutter analyze
      - name: flutter test
        working-directory: apps/mobile
        run: flutter test

      # 5) Сборка мобильного приложения. analyze и test НЕ собирают Kotlin и Swift:
      # ошибка в нативном коде видна только здесь, и лучше здесь, чем на телефоне.
      - name: flutter build apk
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: flutter build ios
        working-directory: apps/mobile
        run: flutter build ios --debug --no-codesign

      # 6) Валидатор цитат под настоящим Python (правило «нет цитаты — нет задачи»).
      - name: evidence validator
        run: |
          pip install pytest
          python tests/api/run_checks.py
          python -m pytest tests/api -q

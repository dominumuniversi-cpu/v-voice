name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) Синтаксис Python-модулей — быстро, без установки зависимостей.
      - name: python syntax
        run: node scripts/syntax-check.mjs

      - name: python imports
        run: node tests/native/py-imports.mjs tests/api/run_checks.py tests/api/scenario.py

      - name: scope visibility
        run: node tests/native/dart-scope-visibility.mjs apps/mobile/lib/main.dart apps/mobile/lib/src/*.dart

      - name: dart list syntax
        run: node tests/native/dart-list.mjs $(find apps/mobile/lib -name '*.dart')

      - name: theme matches prototypes
        run: node tests/native/theme-matches-tokens.mjs
      - name: theme colours
        run: node tests/native/dart-theme-colors.mjs
      - name: address rule consistency
        run: node tests/native/dart-url-rule.mjs
      - name: dart named arguments
        run: node tests/native/dart-named-args.mjs $(find apps/mobile -name '*.dart')

      # 2) Контракт нативных мостов: записи на Android/iOS не разошлись.
      - name: live upload starts analysis
        run: node tests/native/live-upload-starts-analysis.mjs
      - name: error code explanations
        run: node tests/native/error-codes-explained.mjs
      - name: native contract
        run: node tests/native/native-drift-check.mjs

      # 3) Сквозные кейсы конвейера и контракта.
      - name: duplicate imports
        run: node tests/native/import-duplicates.mjs

      - name: test members exist
        run: node tests/native/test-members.mjs

      - name: transport contract
        run: node tests/native/transport-contract.mjs

      - name: prototype css
        run: node tests/native/prototype-vars.mjs

      - name: node tests
        run: node --test "tests/native/*.test.mjs" "tests/api/*.mjs"

      # 4) Связность: функция без вызовов — это «сделано, но не подключено».
      # Ставится рано намеренно: дешёвая проверка идёт до дорогих.
      - name: connectivity
        run: node scripts/connectivity-check.mjs

      # 5) Серверные проверки и валидатор цитат («нет цитаты — нет задачи»).
      # Стоят ДО Flutter и сборки намеренно: падение чужого шага (например, Maven ответил 429)
      # раньше скрывало их целиком — шаг просто помечался skipped, и проверки не выполнялись.
      - name: end-to-end scenario
        run: python tests/api/scenario.py

      - name: server checks
        run: |
          pip install pytest
          pip install -r services/api/requirements.txt
          python tests/api/run_checks.py
          python -m pytest tests/api -q

      # 6) Мобильное приложение: анализатор и тесты контроллера (реальные, без телефона).
      # Java 17 явно: на раннере может стоять Java 25, и Gradle 8.x падает на
      # "Unsupported class file major version 69" — ошибка выглядит как проблема проекта.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: flutter analyze
        working-directory: apps/mobile
        run: flutter pub get && flutter analyze
      - name: flutter test
        working-directory: apps/mobile
        run: flutter test

      # 7) Сборка мобильного приложения. analyze и test НЕ собирают Kotlin и Swift:
      # ошибка в нативном коде видна только здесь, и лучше здесь, чем на телефоне.
      - name: flutter build apk
        working-directory: apps/mobile
        # Maven Central отвечает 429 Too Many Requests при частых сборках. Это не ошибка кода,
        # но без повтора сборка «падает» и человек идёт искать несуществующую поломку.
        run: |
          for attempt in 1 2 3; do
            flutter build apk --debug && exit 0
            echo "попытка $attempt не удалась, ждём и пробуем снова"
            sleep 30
          done
          exit 1
      # iOS собирается только на macOS: на Linux нет toolchain Apple. Отдельная задача в бэклоге (#35).

